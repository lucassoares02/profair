name: profair
description: A project have change the life people.

publish_to: "none"

version: 3.0.52+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  font_awesome_flutter: ^10.4.0
  google_sign_in: ^7.2.0
  dio: ^5.0.0
  flutter_modular: ^5.0.3
  skeletonizer: ^2.1.3
  share_plus: ^10.1.4
  permission_handler: ^12.0.1
  http: ^0.13.6
  shared_preferences: ^2.2.0
  flutter_spinkit: ^5.2.0
  provider: ^6.0.5
  fl_chart: ^0.70.2
  percent_indicator: ^4.2.3
  fluttertoast: ^9.0.0
  firebase_messaging: ^16.1.3
  flutter_animate: ^4.5.2
  url_launcher: ^6.0.20
  flutter_launcher_icons: ^0.13.1
  # flutter_barcode_scanner: 2.0.0
  mobile_scanner: ^7.2.0
  qr_flutter: ^4.1.0
  lottie: ^2.6.0
  path_provider: ^2.1.2
  badges: ^3.1.2
  webview_flutter: ^4.13.1
  cached_network_image: ^3.3.1
  flutter_local_notifications: ^18.0.1
  firebase_core: ^4.6.0
  flutter_native_splash: ^2.3.10

flutter_native_splash:
  color: "#8007ff"
  image: "assets/app/splash.png"
  android: true
  ios: true

flutter_launcher_icons:
  image_path: "assets/app/icon.png"
  ios: true
  remove_alpha_ios: true
  android: "launcher_icon"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/app/icon-android.png"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_localizations:
    sdk: flutter

flutter:
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/inter/Inter-Medium.ttf
        - asset: fonts/inter/Inter-Regular.ttf
        - asset: fonts/inter/Inter-Light.ttf
        - asset: fonts/inter/Inter-Bold.ttf
    - family: Sf
      fonts:
        - asset: fonts/sf/SF-Bold.otf
        - asset: fonts/sf/SF-Light.otf
        - asset: fonts/sf/SF-Medium.otf
    - family: Plus
      fonts:
        - asset: fonts/plus/Plus-Bold.ttf
        - asset: fonts/plus/Plus-Light.ttf
        - asset: fonts/plus/Plus-Medium.ttf

  uses-material-design: true
  assets:
    - assets/images/
flutter_intl:
  enabled: true

dependency_overrides:
  flutter_plugin_android_lifecycle: ^2.0.17
