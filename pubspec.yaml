name: profair
description: A project have change the life people.

publish_to: 'none'

version: 3.0.9+1

environment:
  sdk: ">=2.17.6 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  font_awesome_flutter: ^10.4.0
  google_sign_in: ^5.4.4
  dio: ^5.0.0
  flutter_modular: ^5.0.3
  skeletons: ^0.0.3
  share_plus: ^6.3.1
  permission_handler: ^10.4.3
  http: ^0.13.6
  shared_preferences: ^2.2.0
  flutter_spinkit: ^5.2.0
  flutter_local_notifications: ^15.1.0+1
  timezone: ^0.9.2
  flutter_native_timezone: ^2.0.0
  provider: ^6.0.5
  fl_chart: ^0.62.0
  percent_indicator: ^4.2.3
  fluttertoast: ^8.2.2
  # firebase_core: ^2.27.0
  # firebase_messaging: ^14.6.6
  url_launcher: ^6.1.14
  flutter_native_splash: ^2.3.10
  flutter_launcher_icons: ^0.13.1
  flutter_barcode_scanner: ^2.0.0
  qr_flutter: ^4.1.0
  lottie: ^2.6.0
  intl: ^0.18.1
  path_provider: ^2.1.2
  badges: ^3.1.2


flutter_native_splash:
  color: "#ffffff"
  image: "assets/app/splash.png"
  android: true
  ios: true

flutter_launcher_icons:
  image_path: "assets/app/icon.png"
  ios: true
  remove_alpha_ios: true
  android: "launcher_icon"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/app/icon-android.png"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_localizations:
    sdk: flutter

flutter:
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/inter/Inter-Medium.ttf
        - asset: fonts/inter/Inter-Regular.ttf
        - asset: fonts/inter/Inter-Light.ttf
        - asset: fonts/inter/Inter-Bold.ttf
    - family: Sf
      fonts:
        - asset: fonts/sf/SF-Bold.otf
        - asset: fonts/sf/SF-Light.otf
        - asset: fonts/sf/SF-Medium.otf
        - asset: fonts/sf/SF-Medium-Italic.eot
        - asset: fonts/sf/SF-Bold-Italic.eot
        - asset: fonts/sf/SF-Light-Italic.eot

  uses-material-design: true
  assets:
    - assets/images/
flutter_intl:
  enabled: true
