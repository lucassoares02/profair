workflows:
  flutter-ios-simulator:
        name: Flutter iOS Simulator
        environment:
          groups:
            - android
          flutter: 3.29.0
          xcode: 16.2
        scripts:
          - name: Check envs
            script: |
              echo "📦 Bundle Identifier atual: $PRODUCT_BUNDLE_IDENTIFIER"
              echo "📄 Provisioning Profile: $APPSTORE_MOBILEPROVISION"
              echo "🏷️ Build Number: $FLUTTER_BUILD_NUMBER"
              echo "🚀 Build Name: $FLUTTER_BUILD_NAME"
          - name: Restore GoogleService-Info.plist
            script: |
              echo "$GOOGLE_SERVICE_PLIST_B64" | base64 --decode > ios/Runner/GoogleService-Info.plist
          - script: flutter clean
          - name: Get Flutter packages
            script: |
              flutter pub get
          - name: Check GoogleService-Info.plist exists
            script: |
              if [ -f ios/Runner/GoogleService-Info.plist ]; then
                echo "✅ GoogleService-Info.plist restored!"
                ls -l ios/Runner/GoogleService-Info.plistN
              else
                echo "❌ GoogleService-Info.plist NOT found!"
                exit 1
              fi
          - name: Build for iOS Simulator
            script: |
              flutter build ios
        artifacts:
          - build/ios/iphonesimulator/Runner.app
        cache:
          cache_paths:
            - $FLUTTER_ROOT/.pub-cache
            - ios/Pods
  
  
  
  app-store:
    name: Apple Workflow
    environment:
      groups:
        - android
      flutter: 3.29.0
      ios_signing:
        distribution_type: app_store
        bundle_identifier: br.com.profair.profair
        certificates:
          - api_key_profair_renew
    integrations:
      app_store_connect: api key profair renew

    scripts:


      - script: xcode-project use-profiles
      - script: flutter clean
      - script: flutter --version
      - script: flutter packages pub get
      - script: dart pub cache repair

      - name: Check Info.plist
        script: |
          echo "📄 Info.plist do projeto:"
          cat ios/Runner/Info.plist

      - name: Restore Provisioning Profile
        script: |
          echo "🧹 Limpando outros provisioning profiles"
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/*
          echo "⬇️ Restaurando provisioning profile do \$APPSTORE_MOBILEPROVISION"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$APPSTORE_MOBILEPROVISION" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/ios_profair_notification.mobileprovision
          echo "✅ Provisioning profile restaurado!"
          ls -l ~/Library/MobileDevice/Provisioning\ Profiles
          echo "🔎 Verificando provisioning profile restaurado"
          security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/ios_profair_notification.mobileprovision > profile.plist
          grep -A1 aps-environment profile.plist

      - name: Verify provisioning profile entitlements
        script: |
          echo "🔍 Validando provisioning profile restaurado"

          # extrai para plist
          security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/ios_profair_notification.mobileprovision > profile.plist

          echo "✅ application-identifier:"
          /usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" profile.plist || { echo "❌ Não encontrou application-identifier no profile"; exit 1; }

          echo "✅ aps-environment:"
          APS_ENV=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:aps-environment" profile.plist || echo "none")

          if [[ "$APS_ENV" != "production" ]]; then
            echo "❌ aps-environment não está setado para production (atual: $APS_ENV)"
            exit 1
          fi

          echo "✅ provisioning profile contém aps-environment: production"

      - name: Verify Provisioning Profile
        script: |
          echo "🔍 Verificando provisioning profile"
          security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/ios_profair_notification.mobileprovision > profile.plist

          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" profile.plist)
          APP_ID_NAME=$(/usr/libexec/PlistBuddy -c "Print :AppIDName" profile.plist)
          APP_IDENTIFIER=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" profile.plist)
          APS_ENV=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:aps-environment" profile.plist)
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" profile.plist)

          echo "✅ UUID: $UUID"
          echo "✅ App ID Name: $APP_ID_NAME"
          echo "✅ Application Identifier: $APP_IDENTIFIER"
          echo "✅ APS Environment: $APS_ENV"
          echo "✅ Team ID: $TEAM_ID"

          if [ "$APS_ENV" != "production" ]; then
            echo "❌ APS Environment NÃO está em production!"
            exit 1
          fi

          if [[ "$APP_IDENTIFIER" != "B4DCW8V3J4.br.com.profair.profair" ]]; then
            echo "❌ Application Identifier incorreto!"
            exit 1
          fi

          export PROFILE_UUID=$UUID
          echo "📌 Usando PROFILE_UUID=$PROFILE_UUID"

      - name: Verify Certificates
        script: |
          echo "🔍 Verificando certificado no keychain"
          security find-identity -v -p codesigning | grep "Apple Distribution"
          if [ $? -ne 0 ]; then
            echo "❌ Certificado Apple Distribution não encontrado no keychain"
            exit 1
          fi

      - name: Verify GoogleService-Info.plist
        script: |
          echo "🔍 Verificando GoogleService-Info.plist"
          if [ ! -f ios/Runner/GoogleService-Info.plist ]; then
            echo "❌ GoogleService-Info.plist NÃO encontrado!"
            exit 1
          fi

          GOOGLE_APP_ID=$(/usr/libexec/PlistBuddy -c "Print :GOOGLE_APP_ID" ios/Runner/GoogleService-Info.plist)
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :BUNDLE_ID" ios/Runner/GoogleService-Info.plist)

          echo "✅ GOOGLE_APP_ID: $GOOGLE_APP_ID"
          echo "✅ BUNDLE_ID: $BUNDLE_ID"

          if [[ "$BUNDLE_ID" != "br.com.profair.profair" ]]; then
            echo "❌ BUNDLE_ID no GoogleService-Info.plist não corresponde ao bundle esperado"
            exit 1
          fi

      - name: Verify Info.plist
        script: |
          echo "🔍 Verificando Info.plist"
          if [ ! -f ios/Runner/Info.plist ]; then
            echo "❌ Info.plist NÃO encontrado!"
            exit 1
          fi

          DEPLOYMENT_TARGET=$(/usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" ios/Runner/Info.plist || echo "12.0")
          BG_MODES=$(/usr/libexec/PlistBuddy -c "Print :UIBackgroundModes:0" ios/Runner/Info.plist || echo "none")

          echo "✅ Deployment Target: $DEPLOYMENT_TARGET"
          echo "✅ Background Modes: $BG_MODES"

          if (( $(echo "$DEPLOYMENT_TARGET < 12.0" | bc -l) )); then
            echo "❌ Deployment Target menor que 12.0"
            exit 1
          fi

          if [[ "$BG_MODES" != "remote-notification" ]]; then
            echo "❌ UIBackgroundModes não inclui remote-notification"
            exit 1
          fi

      - name: Restore GoogleService-Info.plist
        script: |
          echo "$GOOGLE_SERVICE_PLIST_B64" | base64 --decode > ios/Runner/GoogleService-Info.plist

      # - name: Install CocoaPods dependencies
      #   script: |
      #     flutter pub get
      #     cd ios
      #     pod install

      - name: Ajustar entitlements para production
        script: |
          echo "🛠️ Corrigindo aps-environment para production"
          sed -i '' 's/development/production/' ios/Runner/Runner.entitlements
          grep -q '<string>production</string>' ios/Runner/Runner.entitlements && echo "✅ Entitlements corrigido!" || echo "❌ Não foi possível corrigir entitlements"


      - name: Criar export_options.plist
        script: |
          PROFILE_UUID=$(cat profile_uuid.txt)
          cat > /Users/builder/export_options.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>B4DCW8V3J4</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>br.com.profair.profair</key>
              <string>ios profair notification</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <true/>
          </dict>
          </plist>
          EOF
              cat /Users/builder/export_options.plist


      - name: Show Runner.entitlements
        script: cat ios/Runner/Runner.entitlements

      - name: Show export_options.plist
        script: cat /Users/builder/export_options.plist

      - name: Force CODE_SIGN_ENTITLEMENTS
        script: |
          plutil -replace CODE_SIGN_ENTITLEMENTS -string "Runner/Runner.entitlements" ios/Runner.xcodeproj/project.pbxproj
          grep -A2 CODE_SIGN_ENTITLEMENTS ios/Runner.xcodeproj/project.pbxproj

      - name: Gerar export_options.plist
        script: |
          echo "📋 Extraindo informações do .mobileprovision"
          security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/ios_profair_notification.mobileprovision > profile.plist

          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" profile.plist)
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" profile.plist)

          echo "✅ Provisioning profile name: $PROFILE_NAME"
          echo "✅ Team ID: $TEAM_ID"

          cat > ios/export_options.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>

            <key>signingStyle</key>
            <string>manual</string>

            <key>teamID</key>
            <string>${TEAM_ID}</string>

            <key>provisioningProfiles</key>
            <dict>
              <key>br.com.profair.profair</key>
              <string>${PROFILE_NAME}</string>
            </dict>

            <key>stripSwiftSymbols</key>
            <true/>

            <key>compileBitcode</key>
            <true/>
          </dict>
          </plist>
          EOF

          echo "📄 export_options.plist gerado:"
          cat ios/export_options.plist


      - name: Ajustar Runner.entitlements
        script: |
          if ! grep -q "<string>production</string>" ios/Runner/Runner.entitlements; then
            echo "🛠️ Adicionando aps-environment=production em Runner.entitlements"
            plutil -replace aps-environment -string production ios/Runner/Runner.entitlements || {
              echo "❌ Falha ao ajustar Runner.entitlements"; exit 1;
            }
          fi
          echo "✅ Runner.entitlements:"
          cat ios/Runner/Runner.entitlements


      - name: Flutter build ipa
        script: |
          echo "🏗️ Construindo IPA com flutter"
          flutter build ipa --export-options-plist=/Users/builder/export_options.plist

           
      - name: Verify GoogleService-Info.plist in .ipa
        script: |
          echo "🔍 Verificando se GoogleService-Info.plist está embutido no .ipa"
          
          # Descompacta o IPA para inspecionar
          unzip -q build/ios/ipa/*.ipa -d extracted_ipa
          
          if [ -f extracted_ipa/Payload/*.app/GoogleService-Info.plist ]; then
            echo "✅ GoogleService-Info.plist encontrado dentro do .ipa"
            ls -l extracted_ipa/Payload/*.app/GoogleService-Info.plist
          else
            echo "❌ GoogleService-Info.plist NÃO encontrado no .ipa"
            exit 1
          fi

      
      # - name: Verify .entitlements in built app
      #   script: |
      #     unzip -q build/ios/ipa/*.ipa -d extracted
      #     codesign -d --entitlements :- extracted/Payload/*.app > built_entitlements.plist
      #     grep -q '<string>development</string>' built_entitlements.plist
      #     if [ $? -ne 0 ]; then
      #       echo "❌ aps-environment não está setado para production no app final!"
      #       exit 1
      #     fi
      #     echo "✅ aps-environment presente no app final e configurado para production."

      #!/usr/bin/env bash

      - name: Verificar aps-environment no .ipa
        script: |
          unzip -q build/ios/ipa/*.ipa -d extracted
          codesign -d --entitlements :- extracted/Payload/*.app > built_entitlements.plist

          echo "🔍 Valor atual de aps-environment no binário:"
          APS_ENV=$(/usr/libexec/PlistBuddy -c "Print :aps-environment" built_entitlements.plist || echo "NÃO ENCONTRADO")
          echo "📋 aps-environment = $APS_ENV"





    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_app_store: true
        release_type: SCHEDULED
        copyright: 2025 Profair





  android:
    name: Android Workflow
    environment:
      flutter: 3.29.0
      android_signing:
        - profair_keystore_android
      groups:
        - android
    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Set up key.properties
        script: |
          echo "storePassword=$CM_KEYSTORE_PASSWORD" > android/key.properties
          echo "keyPassword=$CM_KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$CM_KEY_ALIAS" >> android/key.properties
          echo "storeFile=$CM_KEYSTORE_PATH" >> android/key.properties
      - name: Build AAB
        script: flutter build appbundle --release
    artifacts:
      - build/**/outputs/apk/**/*.apk
      - build/**/outputs/**/*.aab
      - flutter_drive.log
    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: production
