workflows:
  flutter-ios-simulator:
        name: Flutter iOS Simulator
        environment:
          groups:
            - android
          flutter: 3.29.0
          xcode: 16.2
        scripts:
          - name: Restore GoogleService-Info.plist
            script: |
              echo "$GOOGLE_SERVICE_PLIST_B64" | base64 --decode > ios/Runner/GoogleService-Info.plist
          - script: flutter clean
          - name: Get Flutter packages
            script: |
              flutter pub get

          - name: Check GoogleService-Info.plist exists
            script: |
              if [ -f ios/Runner/GoogleService-Info.plist ]; then
                echo "✅ GoogleService-Info.plist restored!"
                ls -l ios/Runner/GoogleService-Info.plist
              else
                echo "❌ GoogleService-Info.plist NOT found!"
                exit 1
              fi
          - name: Build for iOS Simulator
            script: |
              flutter build ios
        artifacts:
          - build/ios/iphonesimulator/Runner.app
        cache:
          cache_paths:
            - $FLUTTER_ROOT/.pub-cache
            - ios/Pods
  app-store:
    name: Apple Workflow
    environment:
      groups:
          - android
      flutter: 3.29.0
      ios_signing:
        provisioning_profiles:
          - app store connect certificate
        certificates:
          - api_key_profair_renew
    integrations:
      app_store_connect: api key profair renew
    scripts:
      - name: Restore Provisioning Profile
        script: |
          echo "Restoring provisioning profile from \$APPSTORE_MOBILEPROVISION"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$APPSTORE_MOBILEPROVISION" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/ios_profair_notification.mobileprovision
          echo "✅ Provisioning profile restored!"
          ls -l ~/Library/MobileDevice/Provisioning\ Profiles

      - script: xcode-project use-profiles
      - script: flutter clean
      - script: flutter --version
      - script: flutter packages pub get
      - script: dart pub cache repair

      - name: Restore GoogleService-Info.plist
        script: |
          echo "$GOOGLE_SERVICE_PLIST_B64" | base64 --decode > ios/Runner/GoogleService-Info.plist

      - name: Install CocoaPods dependencies
        script: |
          flutter pub get
          cd ios
          pod install

      - name: Check GoogleService-Info.plist exists
        script: |
          if [ -f ios/Runner/GoogleService-Info.plist ]; then
            echo "✅ GoogleService-Info.plist restored!"
            ls -l ios/Runner/GoogleService-Info.plist
          else
            echo "❌ GoogleService-Info.plist NOT found!"
            exit 1
          fi

      - name: Flutter build ipa
        script: flutter build ipa --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_app_store: true
        release_type: SCHEDULED
        copyright: 2025 Profair


  android:
    name: Android Workflow
    environment:
      flutter: 3.29.0
      android_signing:
        - profair_keystore_android
      groups:
        - android
    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Set up key.properties
        script: |
          echo "storePassword=$CM_KEYSTORE_PASSWORD" > android/key.properties
          echo "keyPassword=$CM_KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$CM_KEY_ALIAS" >> android/key.properties
          echo "storeFile=$CM_KEYSTORE_PATH" >> android/key.properties
      - name: Build AAB
        script: flutter build appbundle --release
    artifacts:
      - build/**/outputs/apk/**/*.apk
      - build/**/outputs/**/*.aab
      - flutter_drive.log
    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: production
