workflows:
  app-store:
    name: Publishing to App Store workflow
    environment:
      flutter: 3.16.9
      ios_signing:
        provisioning_profiles:
          - app store connect certificate
        certificates:
          - api_key_profair_renew
    integrations:
      app_store_connect: api key profair renew
    scripts:
      - script: xcode-project use-profiles
      - script: flutter clean
      - script: flutter --version
      - script: flutter packages pub get
      - script: dart pub cache repair
      - name: Flutter build ipa
        script: flutter build ipa --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_app_store: true
        release_type: SCHEDULED
        copyright: 2023 Profair


  android:
    name: Android workflow
    environment:
      android_signing:
        - profair_keystore_android
    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Build apk
        script: flutter build appbundle --release
      - name: Set up key properties
        script: cat >> "CM_BUILD_DIR/android/key.properties" <<EOF storePassword=$CM_KEYSTORE_PASSWORD keyPassword=$CM_KEY_PASSWORD $keyAlias=$CM_KEY_ALIAS storeFile=$CM_KEYSTORE_PATH EOF
    artifacts:
      - build/**/outputs/apk/**/*.apk
      - build/**/outputs/**/*.aab
       - flutter_drive.log

       
